services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_server
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_data:/qdrant/storage
    restart: always

  redis:
    image: redis:alpine
    container_name: redis_server
    ports:
      - "6379:6379"
    volumes:
      - ./redis_data:/data
    restart: always

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ekip_api
    ports:
      - "8000:8000"
    volumes:
      - ./Uploads:/app/Uploads
    env_file:
      - .env
    depends_on:
      - qdrant
      - redis
    restart: always

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ekip_worker
    command: celery -A app.workers.celery_app worker --loglevel=info -P solo
    volumes:
      - ./Uploads:/app/Uploads
    env_file:
      - .env
    depends_on:
      - redis
      - qdrant
    restart: always

  userinterface:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: user_interface
    command: 
    depends_on:
      - redis
      - qdrant
      - api
      - worker
    restart: always