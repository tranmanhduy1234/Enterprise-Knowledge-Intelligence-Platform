services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_server
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_data:/qdrant/storage
    networks:
      - ekip_net
    restart: always

  redis:
    image: redis:alpine
    container_name: redis_server
    ports:
      - "6379:6379"
    volumes:
      - ./redis_data:/data
    networks:
      - ekip_net
    restart: always

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ekip_api
    command: python run.py
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/appplication/uploads
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis_server
      - QDRANT_HOST=qdrant_server
    depends_on:
      - qdrant
      - redis
    networks:
      - ekip_net
    restart: always

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ekip_worker
    command: celery -A app.workers.celery_app worker --loglevel=info -P solo
    volumes:
      - ./uploads:/appplication/uploads
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis_server
      - QDRANT_HOST=qdrant_server
    depends_on:
      - redis
      - qdrant
    networks:
      - ekip_net
    restart: always

  userinterface:
    build:
      context: ./UI
      dockerfile: Dockerfile
    container_name: ekip_ui
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - ekip_net
    restart: always

networks:
  ekip_net:
    driver: bridge